# --- Mouse menus ---
# Override tmux's default window-list right-click menu and add "Move To Session...".
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status

bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
  "#{?pane_marked_set,,-}Swap Marked" s { swap-window } \
  '' \
  "Move To Session..." M { run-shell "$HOME/.init/tmux/scripts/pick-session-for-window.sh move #{window_id}" } \
  "Send To Session..." D { run-shell "$HOME/.init/tmux/scripts/pick-session-for-window.sh send #{window_id}" } \
  '' \
  Kill X { kill-window } \
  Respawn R { respawn-window -k } \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  '' \
  "New After" w { new-window -a } \
  "New At End" W { new-window }

bind -n M-MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
  "#{?pane_marked_set,,-}Swap Marked" s { swap-window } \
  '' \
  "Move To Session..." M { run-shell "$HOME/.init/tmux/scripts/pick-session-for-window.sh move #{window_id}" } \
  "Send To Session..." D { run-shell "$HOME/.init/tmux/scripts/pick-session-for-window.sh send #{window_id}" } \
  '' \
  Kill X { kill-window } \
  Respawn R { respawn-window -k } \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  '' \
  "New After" w { new-window -a } \
  "New At End" W { new-window }
