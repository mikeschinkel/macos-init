# --- High contrast UI ---
set -g status on
set -g status-interval 5
set -g status-style fg=colour231,bg=colour18
set -g status-left '#[fg=colour16,bg=colour45,bold] #S #[default] '
set -g status-right '#[fg=colour226,bg=colour18,bold] #{?client_prefix,PREFIX | ,}Help: ^space F1 #[default]'
set -g window-status-format '#[fg=colour252,bg=#{?@window_color,#{@window_color},colour18}] #I:#W '
set -g window-status-current-format '#[fg=colour16,bg=colour226,bold] #I:#W '
set -g message-style fg=colour16,bg=colour226,bold
set -g message-command-style fg=colour16,bg=colour226,bold
set -g menu-style fg=colour231,bg=colour18
set -g menu-selected-style fg=colour16,bg=colour226,bold
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour45
set -g mode-style fg=colour231,bg=colour33,bold
