# --- F-key workflow (no prefix) ---
# F1: on-screen help menu (label, key, command)
# Use choose-tree -w with explicit -F to avoid pane-title noise (e.g. "macmini.local").
# choose-window is an alias to choose-tree -w; this makes behavior explicit.
bind -n F1 display-menu -T "tmux quick help" \
  "F1   More help" "F1" "display-popup -w 88% -h 88% -s 'fg=colour231,bg=colour18' -S 'fg=colour226,bg=colour18,bold' -T 'tmux more help (~/.init/tmux/tmux-cheatsheet.txt)' '~/.init/tmux/scripts/show-cheatsheet.sh'" \
  "F2   Start copy mode" "2" "copy-mode" \
  "F3   New named window" "3" "command-prompt -p 'Window name:' 'new-window -n \"%%\"'" \
  "F5   Rename window" "5" "command-prompt -I '#W' 'rename-window -- \"%%\"'" \
  "F6   Window chooser" "6" "choose-tree -wZ -F '#{window_index}: #{window_name}#{window_flags}'" \
  "F7   Split top/bottom" "7" "split-window -v" \
  "F8   Split left/right" "8" "split-window -h" \
  "F10  Zoom pane" "" "resize-pane -Z" \
  "Opt-, Prev pane" "" "select-pane -t :.-" \
  "Opt-. Next pane" "" "select-pane -t :.+" \
  "Opt-< Prev window" "" "previous-window" \
  "Opt-> Next window" "" "next-window"

# Direct F-key actions
bind -n F2 copy-mode 
bind -n F3 command-prompt -p "Window name:" "new-window -n '%%'"
bind -n F5 command-prompt -I "#W" "rename-window -- '%%'"
bind -n F6 choose-tree -wZ -F '#{window_index}: #{window_name}#{window_flags}'
bind -n F7 split-window -v
bind -n F8 split-window -h
bind -n F10 resize-pane -Z
