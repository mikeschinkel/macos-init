# --- Plugins (loaded directly) ---

# Resurrect: save and restore pane contents and processes
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-default 'bash'
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'

# Continuum: auto-save every 5 minutes
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tmux-continuum/continuum.tmux'
